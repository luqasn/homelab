# Mirror `main` to GitHub with the homelab domains and upstream mail host
# rewritten to example.com placeholders.
#
# This replaces Forgejo's built-in push mirror, which is a raw
# `git push --mirror` and therefore cannot rewrite file contents. Instead this
# job rewrites every occurrence of the prod/stage domains and the mail host
# across the full history of `main` with `git-filter-repo --replace-text`, then
# force-pushes it to GitHub.
# Only `main` is mirrored; other branches and tags are left untouched.
#
# Rewriting history changes every commit SHA, so the GitHub mirror's history is
# intentionally independent of Forgejo's and has to be force-pushed. Only the
# GitHub copy is sanitized; the Forgejo-hosted repo keeps the real values so
# builds and deploys run with the actual domains.
#
# The values to scrub are read at runtime from the in-tree homelab-private.nix
# (`domain.prod`, `domain.stage` and `mailhost`) instead of being hardcoded
# here, so this workflow file itself stays free of them in the public mirror.
#
# Required setup (Forgejo repo -> Settings -> Actions -> Secrets):
#   * GITHUB_MIRROR_TOKEN — GitHub PAT with write access to the mirror
#                           (classic scope `repo`, or fine-grained
#                           "Contents: Read and write").
#
# Also required:
#   Disable the repo's built-in push mirror (Settings -> Repository ->
#   Mirror Settings). Otherwise it runs alongside this job and re-publishes
#   the unredacted history to GitHub (including branches/tags this job does
#   not manage).
#
# The runner provides `git-filter-repo` via `hostPackages`
# (modules/forgejo.nix), so no `nix run`/dev shell is needed here.

name: Mirror to GitHub (sanitized)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  # Never run two mirror pushes at once. Deliberately a distinct group from
  # build-machines/deploy-machines; the single native runner serialises them.
  group: mirror-to-github
  cancel-in-progress: false

env:
  # GitHub mirror target as <owner>/<repo>. Change this to your GitHub repo.
  GITHUB_MIRROR_REPO: "luqasn/homelab"

jobs:
  mirror:
    runs-on: native
    timeout-minutes: 30
    steps:
      - name: Checkout main with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rewrite domain and push
        env:
          GITHUB_MIRROR_TOKEN: ${{ secrets.HOMELAB_GITHUB_MIRROR_TOKEN }}
        run: |
          set -euo pipefail
          export PATH="/run/current-system/sw/bin:$PATH"

          if [ -z "${GITHUB_MIRROR_TOKEN:-}" ]; then
            echo "::error::GITHUB_MIRROR_TOKEN secret is not configured"
            exit 1
          fi

          # Read the PII values to scrub from the in-tree data file instead of
          # hardcoding them here. All values are read in one evaluation, one
          # per line.
          readarray -t private_values < <(nix eval --impure --raw --expr '
            let data = import ./homelab-private.nix;
            in "${data.domain.prod}\n${data.domain.stage}\n${data.mailhost}"
          ')
          HOMELAB_DOMAIN="${private_values[0]:-}"
          HOMELAB_STAGE_DOMAIN="${private_values[1]:-}"
          HOMELAB_MAILHOST="${private_values[2]:-}"
          if [ -z "$HOMELAB_DOMAIN" ] || [ -z "$HOMELAB_STAGE_DOMAIN" ] || [ -z "$HOMELAB_MAILHOST" ]; then
            echo "::error::could not read domain.prod, domain.stage and mailhost from homelab-private.nix"
            exit 1
          fi

          # --replace-text does a literal substring replacement in every file,
          # in every commit. Most specific literal first (the stage domain
          # before the base domain it lives under). Build the replacement file
          # from the values read above so none of them is ever written into
          # this workflow in the first place.
          {
            printf '%s==>stage.example.com\n' "$HOMELAB_STAGE_DOMAIN"
            printf '%s==>example.com\n' "$HOMELAB_DOMAIN"
            printf '%s==>mail.example.com\n' "$HOMELAB_MAILHOST"
          } > /tmp/private-replacements.txt

          if ! command -v git-filter-repo >/dev/null 2>&1; then
            echo "::error::git-filter-repo not found on PATH; redeploy elserver so the runner picks up the hostPackages change in modules/forgejo.nix"
            exit 1
          fi

          git-filter-repo --force --replace-text /tmp/private-replacements.txt

          git remote add github \
            "https://x-access-token:${GITHUB_MIRROR_TOKEN}@github.com/${GITHUB_MIRROR_REPO}.git"

          # Only main, force-pushed (history was rewritten). Other refs on
          # GitHub are intentionally not touched.
          git push --force github HEAD:refs/heads/main
