# Deploy the clan with `clan machines update`.
#
# Runs on the in-house native runner (label "native:host"), i.e. directly on
# elserver — the same host that runs Forgejo — so `clan machines update` reuses
# the host's nix store and can reach both machines over SSH.
#
# offsite-backup is normally powered off (it is only woken for the nightly
# backup; see modules/offsite-backup.nix), but it is still a `clan machines
# update` target, so it must be up before the update and powered down again
# afterwards. Instead of driving IPMI/smart-switch directly, this workflow
# reuses the exact systemd units the backup itself runs through:
#
#   * turn-on.service  — powers the smart switch + IPMI on and waits for SSH
#   * turn-off.service — IPMI soft-off, waits for power-off, cuts the switch
#
# Both are pulled in by `offsite-backup.target`, so the deploy and the backup
# share one already-tested power path. They live on elserver and need root, so
# they are started over ssh — the runner itself is an unprivileged systemd
# DynamicUser and cannot start system units directly. (Plain ssh with explicit
# key/user options, not `clan ssh -c`: see the note in the power-on step.)
#
# After the machines are updated, the workflow also pushes the Coder workspace
# template to the server on elserver. That push is a systemd unit on elserver
# (`coder-push-template.service`, defined in modules/coder/server.nix) that this
# job starts, so a failure is reported as a failed job. It keeps the template —
# and therefore every workspace agent — on the same Coder version as the server
# in a single deploy when modules/coder/template changes. The unit uses root's
# `coder login` session; modules/coder/server.nix raises
# CODER_DEFAULT_TOKEN_LIFETIME so that session does not expire (which is what
# broke the manual push).
#
# Notes:
#   * `clan machines update` without machine arguments updates every machine.
#   * It generates/decrypts clan vars and uploads the secrets to each target,
#     so it needs the admin age key (see CLAN_SOPS_AGE_KEY below).
#   * The runner service PATH only contains coreutils/findutils/gnugrep/gnused/
#     systemd plus the configured `hostPackages` (see modules/forgejo.nix), so
#     `nix` is not on PATH and the host system profile is added explicitly.
#
# Required setup (Forgejo repo -> Settings -> Actions -> Secrets):
#   * HOMELAB_DEPLOY_SSH_KEY — private half of the CI deploy key, a dedicated
#     key pair for this workflow. Its PUBLIC half is listed in
#     `users.users.root.openssh.authorizedKeys.keys` in both
#     machines/*/configuration.nix, so authorisation is managed by deploys
#     instead of manual /root/.ssh/authorized_keys entries. It is installed
#     as `$HOME/.ssh/homelab_deploy` and passed explicitly on the clan command
#     line: `clan ssh --ssh-option IdentityFile <path>` and
#     `clan machines update --target-host root@<host>?IdentityFile=<path>`.
#     (`machines update` has no SSH-options environment variable or flag, and
#     the flake's targetHost is intentionally left clean.) This
#     keeps the deploy working even though /etc/ssh/ssh_config on elserver
#     points at the root-only, unreadable clan secret
#     /run/secrets/vars/ssh-key-root/id_ed25519.
#     NOTE: a machine can only be deployed once this key is authorised on its
#     RUNNING system, so a new machine (or one whose running generation
#     predates the key) needs a one-time bootstrap from an admin machine with
#     a key that is already accepted, e.g. append the public half to
#     /root/.ssh/authorized_keys over SSH or run a manual
#     `clan machines update <machine>` with an admin key, then let this
#     workflow take over.
#   * CLAN_SOPS_AGE_KEY — the admin age private key (`clan vars keygen`,
#     normally ~/.config/sops/age/keys.txt). Required to decrypt the machine
#     age keys and the clan vars/secrets while updating.

name: Deploy all machines

on:
  push:
    branches:
      - main
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

concurrency:
  # Never run two deploys at the same time on the single native runner.
  group: deploy-machines
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: native
    # Deploys build on the target hosts, so this can take a while on a cold
    # store; keep the same budget as the build workflow.
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clan deploy SSH key
        env:
          HOMELAB_DEPLOY_SSH_KEY: ${{ secrets.HOMELAB_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${HOMELAB_DEPLOY_SSH_KEY}" ]; then
            echo "::error::HOMELAB_DEPLOY_SSH_KEY secret is not configured"
            exit 1
          fi
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$HOMELAB_DEPLOY_SSH_KEY" > "$HOME/.ssh/homelab_deploy"
          chmod 600 "$HOME/.ssh/homelab_deploy"
          # No ~/.ssh/config entry here: it would not be read anyway (the runner
          # is a DynamicUser whose passwd home is not $HOME, and ssh expands `~`
          # from passwd), and /etc/ssh/ssh_config's `Host *` IdentityFile points
          # at the unreadable clan secret. The power-on/off and restart steps
          # therefore pass -F /dev/null -i "$HOME/.ssh/homelab_deploy" root@elserver
          # explicitly.

      - name: Install clan secrets age key
        env:
          CLAN_SOPS_AGE_KEY: ${{ secrets.CLAN_SOPS_AGE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${CLAN_SOPS_AGE_KEY}" ]; then
            echo "::error::CLAN_SOPS_AGE_KEY secret is not configured"
            exit 1
          fi
          install -d -m 700 "$HOME/.config/sops/age"
          printf '%s\n' "$CLAN_SOPS_AGE_KEY" > "$HOME/.config/sops/age/keys.txt"
          chmod 600 "$HOME/.config/sops/age/keys.txt"

      - name: Power on offsite-backup
        run: |
          set -euo pipefail
          export PATH="/run/current-system/sw/bin:$PATH"
          # Reuse the nightly backup's turn-on.service (wired into
          # offsite-backup.target) so the host is up before it is updated.
          #
          # Plain `ssh`, not `clan ssh -c`: the latter ignores the remote
          # command's exit status (interactive_ssh uses subprocess.run(check=False)),
          # so a failed power-on would be silent. ssh runs the command through the
          # remote shell and propagates the exit status.
          #
          # Everything is passed explicitly and `-F /dev/null` ignores every ssh
          # config file. Two reasons: (1) the runner is a systemd DynamicUser
          # whose passwd home is not the $HOME the workflow writes ~/.ssh/config
          # into (ssh expands `~` from passwd, so it never saw the Host block),
          # and (2) /etc/ssh/ssh_config's `Host *` points IdentityFile at the
          # root-only clan secret /run/secrets/vars/ssh-key-root/id_ed25519.
          ssh -F /dev/null \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/homelab_deploy" \
            root@elserver '/run/current-system/sw/bin/systemctl start turn-on.service'

      - name: Snapshot ZFS datasets before deploy
        # Take a local zfs-autobackup snapshot on elserver before any machine is
        # switched, so a deploy that corrupts data can be rolled back to the
        # state right before it.
        #
        # Omitting the TARGET-PATH puts zfs-autobackup in snapshot-only mode: it
        # creates the same `offsite-...` snapshots the nightly backup uses, but
        # sends nothing. (The next nightly offsite run replicates them, and the
        # shared `offsite` label keeps them within the normal retention.)
        # --allow-empty guarantees a snapshot exists even when nothing changed
        # since the last nightly run, so every deploy has a distinct rollback
        # point. zfs-autobackup is in elserver's environment.systemPackages
        # (modules/homelab.nix), so it is already on the host.
        run: |
          set -euo pipefail
          export PATH="/run/current-system/sw/bin:$PATH"
          # Explicit ssh options, see the power-on step above.
          ssh -F /dev/null \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/homelab_deploy" \
            root@elserver '/run/current-system/sw/bin/zfs-autobackup -v --allow-empty offsite'

      - name: Update all machines
        run: |
          set -euo pipefail
          export PATH="/run/current-system/sw/bin:$PATH"
          nix --version
          # `--host-key-check accept-new` is required: the default is `ask`, which
          # cannot prompt in CI and makes offsite-backup fail with
          # "Host key verification failed" on its first contact.
          #
          # `machines update` has no --ssh-option flag, so the deploy key is
          # passed via --target-host (same user@host?Opt=value syntax as
          # targetHost). --target-host accepts only one machine, hence the loop
          # over the inventory. Machine names match their target hosts here
          # (root@elserver / root@offsite-backup).
          machines="$(nix develop --command clan machines list)"
          if [ -z "$machines" ]; then
            echo "::error::clan machines list returned no machines"
            exit 1
          fi
          for machine in $machines; do
            nix develop --command clan machines update "$machine" \
              --host-key-check accept-new \
              --target-host "root@${machine}?IdentityFile=$HOME/.ssh/homelab_deploy" \
              --build-host localhost
          done

      - name: Push Coder workspace template
        # Start the systemd unit defined in modules/coder/server.nix. It is not
        # wanted by any target, so this job is the only thing that runs it. If
        # the current template revision was already pushed the unit is a no-op
        # (it records a stamp).
        run: |
          set -euo pipefail
          export PATH="/run/current-system/sw/bin:$PATH"
          ssh -F /dev/null \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/homelab_deploy" \
            root@elserver '/run/current-system/sw/bin/systemctl start coder-push-template.service'

      - name: Power off offsite-backup
        # Only power the host back down after a successful update; leave it up
        # if the deploy failed so the failure can be inspected in place.
        if: success()
        run: |
          set -euo pipefail
          export PATH="/run/current-system/sw/bin:$PATH"
          # Same unit the nightly backup uses (via offsite-backup.target).
          # Explicit ssh options for the same reason as the power-on step above.
          ssh -F /dev/null \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/homelab_deploy" \
            root@elserver '/run/current-system/sw/bin/systemctl start turn-off.service'

      - name: Schedule idle-gated runner restart
        # The runner deliberately survives its own switch (modules/forgejo.nix
        # sets restartIfChanged = false) so switch-to-configuration cannot stop
        # it and cancel this job mid-deploy. It therefore keeps running the
        # previous generation. Start the unit defined in modules/forgejo.nix that
        # restarts it once Forgejo reports no task left queued or running, so it
        # picks up any changes (hostPackages, binary, ...) without cancelling the
        # other push-to-main workflows sitting behind this deploy. `if: always()`
        # so a failed/partial deploy also gets a fresh runner.
        #
        # `--no-block` is essential: the gate runs on the host and would
        # otherwise wait for this very job to finish (it is a `native` task too)
        # while this step waits for the gate — a deadlock. Returning immediately
        # lets the job end, freeing the runner for the queued tasks the gate is
        # waiting on.
        if: always()
        run: |
          set -euo pipefail
          export PATH="/run/current-system/sw/bin:$PATH"
          # Explicit ssh options (see the power-on step); this also surfaces a
          # failure.
          ssh -F /dev/null \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -i "$HOME/.ssh/homelab_deploy" \
            root@elserver '/run/current-system/sw/bin/systemctl --no-block start forgejo-runner-restart-when-idle.service'
