# Build every machine in the clan with `clan machines build`.
#
# Runs on the in-house native runner (label "native:host"), i.e. directly on
# the host that also runs Forgejo, so the host's nix store is used and
# rebuilds between runs are incremental.
#
# Notes:
#   * `clan machines build` without machine arguments builds all machines.
#   * The default format is "toplevel", which only evaluates and builds the
#     system closure; no secrets are needed. Clan only injects the machine's
#     decryption key into image formats (iso, sd-card, ...), which this
#     workflow does not build.
#   * Before building, `clan vars check` verifies that every generated var is
#     present and up to date. The deploy workflow generates missing vars on its
#     runner, but it cannot push the resulting encrypted files back, so a PR
#     that adds or changes a vars generator must run `clan vars generate` and
#     commit the files under vars/ first. Without this gate the generated
#     secrets would silently be lost on the next deploy.
#   * The runner service PATH only contains coreutils/findutils/gnugrep/gnused/
#     systemd plus the configured `hostPackages` (see modules/forgejo.nix), so
#     `nix` is not on PATH and the host system profile is added explicitly.
#
# No secrets are required: the flake has no private inputs, and `clan vars
# check` only inspects the (encrypted) vars store.

name: Build all machines

# Only validate builds on pull requests (and manual runs): merges to main are
# already built by the deploy workflow (`clan machines update` builds on the
# target hosts), so a separate build on main would be redundant.
on:
  pull_request:
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

concurrency:
  # Never run two heavy builds at the same time on the single native runner.
  group: build-machines
  cancel-in-progress: false

jobs:
  build:
    runs-on: native
    # Whole-system builds can take a while on a cold store.
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check clan vars are committed
        # The deploy workflow generates missing vars on its runner but cannot
        # push them back, so generated secrets would be lost. Fail the PR here
        # instead, forcing the branch to carry the generated files.
        run: |
          set -euo pipefail
          export PATH="/run/current-system/sw/bin:$PATH"
          if ! nix develop --command clan vars check; then
            echo "::error::Clan vars are missing or outdated. Run 'nix develop --command clan vars generate' in this branch, commit the resulting files under vars/, and push again."
            exit 1
          fi

      - name: Build all machines
        run: |
          set -euo pipefail
          export PATH="/run/current-system/sw/bin:$PATH"
          nix --version
          nix develop --command clan machines build
